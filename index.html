<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин ноутбуків</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="logo">
    Ноутбуки
  </div>
  <nav class="nav">
    <a href="#">Головна</a>
    <a href="#">Каталог</a>
    <a href="#">Про нас</a>
    <a href="#">Контакти</a>
  </nav>
  <div class="cart">
    <a href="#">Кошик</a>
  </div>
</header>

<!-- Додано зображення зверху -->
<section class="top-image">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCsUWoGS0ssODxGjrbJ0KQgVmKIKrRvnLmZg&s" alt="Зображення магазину">
</section>

<main class="products">
  <div class="product">
    <a href="https://example.com/laptop1-details">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/AsusTek-black-logo.png" alt="Ноутбук ASUS">
    </a>
    <h2>Ноутбук ASUS</h2>
    <p>Потужний ноутбук для роботи та ігор.</p>
    <button>Детальніше</button>
  </div>
  <div class="product">
    <a href="https://e7.pngegg.com/pngimages/420/350/png-clipart-hewlett-packard-laptop-logo-computer-hp-280-g1-hewlett-packard-text-trademark.png">
      <img src="https://e7.pngegg.com/pngimages/420/350/png-clipart-hewlett-packard-laptop-logo-computer-hp-280-g1-hewlett-packard-text-trademark.png" alt="Ноутбук HP">
    </a>
    <h2>Ноутбук HP</h2>
    <p>Надійний та легкий для навчання.</p>
    <button>Детальніше</button>
  </div>
  <div class="product">
    <a href="https://example.com/laptop3-details">
      <img src="https://c0.klipartz.com/pngpicture/741/439/gratis-png-patrocinador-del-logotipo-de-dell-organizacion-hewlett-packard-hewlett-packard.png" alt="Ноутбук Dell">
    </a>
    <h2>Ноутбук Dell</h2>
    <p>Ідеальний вибір для бізнесу.</p>
    <button>Детальніше</button>
  </div>
  <div class="product">
    <a href="https://example.com/laptop4-details">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt1prA4gbrGbY4d-suBEjAZzhhHgjUPnwRDA&s" alt="Ноутбук Lenovo">
    </a>
    <h2>Ноутбук Lenovo</h2>
    <p>Практичний ноутбук за доступною ціною.</p>
    <button>Детальніше</button>
  </div>
</main>

<footer class="footer">
  <p>© 2025 Магазин ноутбуків. Всі права захищені.</p>
</footer>

</body>
</html>
